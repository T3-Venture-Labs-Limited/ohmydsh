name: Canary

# Weekly: try the newest community plugin versions and the next DSH release against the whole set.
# Skeleton for milestone 2: it resolves what is new and runs the same install + compose check as CI.
# Opening the "bump ohmydsh.json" pull request (green) or an issue (red) is the TODO marked below.

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  # pull-requests: write and issues: write are needed once the TODO steps are filled in.

jobs:
  newest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DSH_HOME: ${{ github.workspace }}/.tmp/dsh-home
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Resolve the newest community versions
        run: |
          node -e "
            const m = require('./ohmydsh.json');
            const own = new Set(Object.keys(m.sources));
            const all = { ...m.plugins.core };
            for (const p of Object.values(m.plugins.packs)) Object.assign(all, p);
            for (const n of Object.keys(all)) if (!own.has(n)) console.log(n);
          " | while read -r pkg; do
            echo "$pkg  pinned=$(node -p "(()=>{const m=require('./ohmydsh.json');const a={...m.plugins.core};Object.values(m.plugins.packs).forEach(p=>Object.assign(a,p));return a['$pkg']})()")  latest=$(npm view "$pkg" version)"
          done | tee newest.txt
      - name: Install the next DSH release candidate
        run: |
          npm install -g "@deepseek-ai/dsh@$(npm view @deepseek-ai/dsh dist-tags.latest)"
          dsh --version
      - name: Install the set and check it composes
        run: |
          node packages/cli/bin/omd.js setup --dev --no-dsh-install
          dsh --profile omd --dump-config > /dev/null 2> dump.err
          if grep -E 'not found|invalid|error' dump.err; then exit 1; fi
      # TODO(milestone 2): on success, rewrite the pins in ohmydsh.json from newest.txt and open a pull request
      # (peter-evans/create-pull-request). On failure, open or update an issue with newest.txt and the log.
