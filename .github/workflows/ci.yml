name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  private-strings:
    name: private strings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-private-strings.mjs

  cli:
    name: omd CLI and script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check packages/cli/bin/omd.js
      - run: node --test "packages/cli/tests/**/*.test.*js"
      - run: node --test scripts/tests/
      - run: sh -n install.sh

  # Package checks, manifest, private strings, pack audit, omd setup from the packed tarballs into a clean home (with the
  # pinned DSH), every pack, setup --dev, omd update from the last release, rollback, web boots. Linux and macOS.
  gate:
    name: gate
    needs: [cli]
    uses: ./.github/workflows/gate.yml
