name: Release

# Push a tag v<ohmydsh.json version> (for example v0.1.0), or start this workflow by hand / from follow.yml with the
# `tag` input (a tag that already exists; the workflow then checks that tag out and behaves exactly like the tag push):
#   1. every check runs, the tag must equal ohmydsh.json's version;
#   2. every public package whose version is not on npm yet is published (re-runs are safe: published versions are skipped);
#   3. the GitHub Release is created with the notes from CHANGELOG.md;
#   4. the desktop apps and the Android APK are built and attached (apps.yml).
#
# Needs the repository secret NPM_TOKEN: an npm automation (or granular, read+write on @t3labs) token.
# Provenance is on: the packages show a verified build badge on npmjs.com.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, for example v0.1.4 (must equal ohmydsh.json version in that tag)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  # The tag being released: the pushed tag, or the dispatch input (then github.ref is the branch the run started from).
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  publish:
    name: check and publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write   # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: The tag must exist
        run: git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}" >/dev/null || { echo "::error title=No such tag::${RELEASE_TAG} does not exist in this repository"; exit 1; }
      - name: Is NPM_TOKEN set?
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error title=NPM_TOKEN is missing::Add the repository secret NPM_TOKEN (Settings > Secrets and variables > Actions) with publish rights on the @t3labs npm organisation, then re-run this workflow."
            exit 1
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: The tag must equal the manifest version
        run: |
          VERSION=$(node -p "require('./ohmydsh.json').version")
          if [ "${RELEASE_TAG}" != "v${VERSION}" ]; then
            echo "::error title=Tag does not match ohmydsh.json::Tag is ${RELEASE_TAG} but ohmydsh.json says version ${VERSION}. Delete the tag, fix the version and tag again."
            exit 1
          fi
          echo "releasing ${VERSION}"
      - name: ffmpeg (the Studio tests build a tiny test video)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run check
      - run: pnpm run build
      - run: pnpm run check:manifest
      - run: node scripts/check-private-strings.mjs
      - name: Pack audit (contents of every tarball)
        run: node scripts/pack-all.mjs
      - name: Publish packages that are not on npm yet
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        # pnpm skips a package whose exact version is already on the registry, so a re-run after a partial failure
        # publishes only what is missing.
        run: pnpm -r publish --access public --no-git-checks --provenance

  github-release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs "${RELEASE_TAG#v}" > release-notes.md
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "ohmydsh ${RELEASE_TAG#v}" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" --title "ohmydsh ${RELEASE_TAG#v}" --notes-file release-notes.md --verify-tag
          fi

  apps:
    name: desktop apps and Android APK
    needs: github-release
    uses: ./.github/workflows/apps.yml
    with:
      release_tag: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: write
    secrets: inherit
