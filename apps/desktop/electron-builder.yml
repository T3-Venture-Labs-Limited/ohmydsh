appId: ai.t3.ohmydsh
productName: ohmydsh
copyright: Copyright © T3 Venture Labs
directories:
  output: dist
  buildResources: build
files:
  - package.json
  - src/**
  - build/tray.png
  - build/tray-template.png
  - build/icon.png
  - build/icon.ico
  - "!**/*.map"
# Read by child processes (a child cannot read inside an asar): the omd CLI + manifest, and npm, which installs DSH on first run.
extraResources:
  - from: bundle/ohmydsh
    to: ohmydsh
    filter: ["**/*"]
  - from: bundle/npm.tgz
    to: npm.tgz
publish:
  provider: github
  owner: T3-Venture-Labs-Limited
  repo: ohmydsh
# Unsigned for now: signing needs a Windows certificate and an Apple Developer ID (see docs/APPS.md).
artifactName: ohmydsh-${version}-${os}-${arch}.${ext}
linux:
  target: [AppImage, deb]
  # The official Node.js binary (bundle.mjs downloads and checksums it): the app runs DSH on it, not on Electron. Every OS
  # ships one (see the win and mac sections): DSH's native add-on only loads under a few exact Electron builds, and sharp
  # crashes under Electron-as-Node on Linux.
  extraResources:
    - from: bundle/node/linux-x64
      to: node
      filter: ["**/*"]
  executableName: ohmydsh
  category: Development
  icon: build/icon.png
  maintainer: T3 Venture Labs <hello@t3.ai>
  synopsis: DeepSeek Harness with the ohmydsh plugin set
  desktop:
    entry:
      Name: ohmydsh
      Comment: ohmydsh, DeepSeek Harness with batteries included
      StartupWMClass: ohmydsh
      Categories: Development;
deb:
  depends: [libgtk-3-0, libnotify4, libnss3, libxss1, libxtst6, xdg-utils, libatspi2.0-0, libuuid1, libsecret-1-0]
win:
  target: [{ target: nsis, arch: [x64] }]
  icon: build/icon.ico
  extraResources:
    - from: bundle/node/win-x64
      to: node
      filter: ["**/*"]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  artifactName: ohmydsh-${version}-win-${arch}-setup.${ext}
mac:
  target: [{ target: dmg, arch: [arm64, x64] }]
  icon: build/icon.icns
  category: public.app-category.developer-tools
  identity: null
  hardenedRuntime: false
  # One job builds both architectures: ${arch} is expanded per architecture, so the arm64 app carries the arm64 Node and the x64 app the x64 one.
  extraResources:
    - from: bundle/node/mac-${arch}
      to: node
      filter: ["**/*"]
dmg:
  artifactName: ohmydsh-${version}-mac-${arch}.${ext}
