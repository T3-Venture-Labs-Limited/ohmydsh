<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'self'">
<title>ohmydsh</title>
<style>
  :root { color-scheme: light dark; --bg:#F7F7F5; --fg:#0A0A0A; --muted:#5B5B60; --line:#DCDCD8; --blue:#4D6BFE; --danger:#C62828 }
  @media (prefers-color-scheme: dark) { :root { --bg:#0B0B0D; --fg:#F4F4F2; --muted:#A0A0A8; --line:#2A2A30; --danger:#EF9A9A } }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif }
  main { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:32px; box-sizing:border-box; text-align:center }
  img { height:56px; width:auto }
  .dark { display:none } @media (prefers-color-scheme: dark) { .light { display:none } .dark { display:block } }
  h1 { font-size:18px; margin:0; font-weight:600 }
  p { margin:0; color:var(--muted); max-width:34rem; word-break:break-word }
  .bar { width:min(360px,80vw); height:4px; background:var(--line); border-radius:2px; overflow:hidden }
  .bar > div { height:100%; width:0; background:var(--blue); transition:width .4s ease }
  pre { text-align:left; max-width:min(640px,90vw); max-height:180px; overflow:auto; background:color-mix(in srgb,var(--fg) 6%,transparent); padding:12px; border-radius:8px; font-size:12px; white-space:pre-wrap }
  button { font:inherit; padding:8px 16px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--fg); cursor:pointer }
  button.primary { background:var(--blue); border-color:var(--blue); color:#fff }
  .row { display:flex; gap:8px; justify-content:center }
  [hidden] { display:none !important }
</style>
</head>
<body>
<main>
  <img class="light" src="assets/lockup.svg" alt="ohmydsh">
  <img class="dark" src="assets/lockup-dark.svg" alt="ohmydsh">
  <div id="working">
    <h1 id="step">Starting…</h1>
    <p id="detail"></p>
    <div class="bar" style="margin:16px auto 0"><div id="fill"></div></div>
  </div>
  <div id="failed" hidden>
    <h1 id="etitle">Something went wrong</h1>
    <p id="emsg"></p>
    <pre id="elog" hidden></pre>
    <div class="row" style="margin-top:16px"><button class="primary" id="retry">Try again</button><button id="log">Open the log</button><button id="quit">Quit</button></div>
  </div>
</main>
<script src="loading.js"></script>
</body>
</html>
