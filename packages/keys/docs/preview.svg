<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="An approval card with number badges on its buttons and a key hint line">
  <!-- artwork -->
  <rect width="640" height="300" rx="14" fill="#F6F7F9"/>
  <rect x="60" y="40" width="520" height="190" rx="14" fill="#FFFFFF" stroke="#D9DEE5"/>
  <circle cx="84" cy="64" r="5" fill="#E0A100"/>
  <text x="98" y="68" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#5B6573">Waiting for your approval</text>
  <text x="84" y="104" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1B2430">Run: pnpm run build</text>
  <rect x="84" y="118" width="472" height="34" rx="8" fill="#EEF1F5"/>
  <text x="96" y="140" font-family="ui-monospace, monospace" font-size="13" fill="#1B2430">pnpm run build</text>
  <rect x="270" y="174" width="86" height="34" rx="8" fill="#FFFFFF" stroke="#C5CCD6"/>
  <rect x="280" y="183" width="16" height="16" rx="4" fill="none" stroke="#5B6573"/>
  <text x="284" y="195" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#5B6573">3</text>
  <text x="303" y="196" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1B2430">Reject</text>
  <rect x="364" y="174" width="104" height="34" rx="8" fill="#FFFFFF" stroke="#C5CCD6"/>
  <rect x="374" y="183" width="16" height="16" rx="4" fill="none" stroke="#5B6573"/>
  <text x="378" y="195" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#5B6573">1</text>
  <text x="397" y="196" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1B2430">Allow once</text>
  <rect x="476" y="174" width="80" height="34" rx="8" fill="#4D6BFE"/>
  <rect x="486" y="183" width="16" height="16" rx="4" fill="none" stroke="#FFFFFF"/>
  <text x="490" y="195" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">2</text>
  <text x="509" y="196" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#FFFFFF">Always</text>
  <text x="320" y="256" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#5B6573">1–3 choose · Enter allow once · Esc reject</text>
</svg>
